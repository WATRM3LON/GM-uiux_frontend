<article class="testimonial-card" (click)="handleCardClick()">
  <!-- Big Quote Icon -->
  <div class="testimonial-card__quote-icon-wrap" aria-hidden="true">
    <svg class="testimonial-card__quote-icon" viewBox="0 0 24 24" fill="currentColor">
      <path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"/>
    </svg>
  </div>

  <!-- Body -->
  <div class="testimonial-card__body">
    <blockquote class="testimonial-card__quote">
      "{{ data().quoteText }}"
    </blockquote>

    <!-- Author Info -->
    <footer class="testimonial-card__author">
      <img
        [src]="data().authorAvatarUrl"
        [alt]="data().authorName"
        class="testimonial-card__avatar"
        loading="lazy"
      />
      <div class="testimonial-card__author-info">
        <span class="testimonial-card__author-name">{{ data().authorName }}</span>
        @if (data().authorTitle) {
          <span class="testimonial-card__author-title">{{ data().authorTitle }}</span>
        }
      </div>
    </footer>
  </div>
</article>
