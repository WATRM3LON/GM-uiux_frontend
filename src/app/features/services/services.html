<section class="services" aria-label="N-Compass TV Services">
  <div class="services__container">

    <!-- Section Header -->
    <header class="services__header">
      <span class="services__tag">GO BEYOND THE SCREENS</span>
      <h2 class="services__title">
        Expand Your Reach with
        <span class="services__title-highlight">Multichannel Advertising</span>
      </h2>
      <p class="services__subtitle">
        Grow beyond digital billboards with expert-managed campaigns, performance analytics, and monthly client reporting.
      </p>
    </header>

    <!-- Services Carousel Track -->
    <div
      class="services__carousel-wrapper"
      [style.--cards-per-view]="cardsPerView()"
      [style.--active-index]="activeIndex()"
    >
      <div
        class="services__carousel-track"
        [style.transform]="'translateX(calc(-1 * ' + activeIndex() + ' * (100% + var(--gap)) / ' + cardsPerView() + '))'"
      >
        @for (item of services; track item.id) {
          <div class="services__card-item">
            <app-feature-card
              [data]="item"
              (cardClick)="handleServiceSelect(item)"
            />
          </div>
        }
      </div>
    </div>

    <!-- Carousel Controls -->
    <div class="services__controls">
      <button
        type="button"
        class="services__arrow-btn"
        (click)="prevSlide()"
        aria-label="Previous service"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Pagination Indicators -->
      <div class="services__pagination">
        @for (dotIndex of visibleDots; track dotIndex) {
          <button
            type="button"
            class="services__dot"
            [class.services__dot--active]="dotIndex === activeIndex()"
            (click)="goToSlide(dotIndex)"
            [attr.aria-label]="'Go to slide ' + (dotIndex + 1)"
          ></button>
        }
      </div>

      <button
        type="button"
        class="services__arrow-btn"
        (click)="nextSlide()"
        aria-label="Next service"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

  </div>
</section>
