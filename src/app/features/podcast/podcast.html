<section class="podcast" aria-label="Listen to Our Podcast">
  <div class="podcast__container">

    <!-- Header Section -->
    <header class="podcast__header">
      <h2 class="podcast__title">LISTEN TO OUR PODCAST</h2>

      <p class="podcast__subtitle">
        Join industry experts as they discuss the evolution of digital signage, advertising technology, and marketing strategies. Gain valuable knowledge, discover emerging trends, and learn how businesses are transforming customer engagement through digital innovation.
      </p>

      <!-- Action Buttons -->
      <div class="podcast__actions">
        <button
          type="button"
          class="podcast__btn podcast__btn--spotify"
          (click)="onSpotifyClick()"
          aria-label="Listen on Spotify"
        >
          <svg class="podcast__btn-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424c-.18.295-.563.387-.857.207-2.35-1.434-5.308-1.758-8.793-.962-.335.077-.67-.133-.746-.468-.077-.335.132-.67.467-.746 3.809-.87 7.076-.496 9.722 1.115.294.18.386.563.207.854zm1.23-2.737c-.226.367-.706.482-1.072.257-2.687-1.652-6.785-2.131-9.965-1.166-.413.125-.848-.106-.973-.519-.125-.413.106-.848.519-.973 3.632-1.102 8.147-.568 11.234 1.328.366.226.481.707.257 1.073zm.13-2.847C14.717 8.91 8.358 8.694 4.67 9.813c-.496.15-1.022-.132-1.173-.628-.15-.496.132-1.022.628-1.173 4.237-1.286 11.264-1.034 15.75 1.63.444.264.59.84.326 1.284-.264.444-.84.59-1.284.326z"/>
          </svg>
          <span>Spotify</span>
        </button>

        <button
          type="button"
          class="podcast__btn podcast__btn--apple"
          (click)="onAppleClick()"
          aria-label="Listen on Apple Podcasts"
        >
          <svg class="podcast__btn-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.67-.82 1.13-1.96.99-3.1-.97.04-2.17.65-2.86 1.46-.61.72-1.15 1.88-.99 3 1.08.08 2.19-.54 2.86-1.36z"/>
          </svg>
          <span>Apple</span>
        </button>
      </div>
    </header>

    <!-- Podcast Media Frame -->
    <div class="podcast__media-frame" (click)="onPlayClick()">
      <img
        src="assets/images/indoorbillboards2.png"
        alt="N-Compass TV Podcast Episode Preview"
        class="podcast__media-img"
      />
      <div class="podcast__media-overlay"></div>
      
      <!-- Play Button Overlay -->
      <button
        type="button"
        class="podcast__play-btn"
        aria-label="Play Podcast Video"
      >
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z" />
        </svg>
      </button>
    </div>

  </div>
</section>
